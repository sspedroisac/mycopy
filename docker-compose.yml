services:
  dev:
    build:
      context: .
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    working_dir: /app
    stdin_open: true
    tty: true
    volumes:
      - .:/app
      - /tmp/.X11-unix:/tmp/.X11-unix
    environment:
      DISPLAY: ${DISPLAY}
      WEBKIT_DISABLE_DMABUF_RENDERER: "1"
    command: npm run tauri dev
